[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "../node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Semaphore's verifier and PoseidonT3 are large; via-IR keeps them under the stack limit.
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/vectors" },
  { access = "read", path = "./script/lib" },
  # Semaphore's unlinked bytecode, linked by hand to the canonical PoseidonT3 (script/lib/SemaphoreDeployer.sol).
  { access = "read", path = "./out" },
]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "erc-8004/=lib/erc-8004-contracts/contracts/",
  "@chainlink/cre/=lib/chainlink-cre/src/",
  "@semaphore-protocol/contracts/=../node_modules/@semaphore-protocol/contracts/",
  "@zk-kit/=../node_modules/@zk-kit/",
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
]

[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 120
